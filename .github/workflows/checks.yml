name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - name: Python regressions, including textures
        run: python -m unittest discover -s tests -v
      - name: JavaScript regressions
        run: node --test tests/test_*.mjs
      - name: Build configuration
        run: |
          bash -n standalone/package.sh
          sh -n docker/prepare/prepare.sh
          docker compose config --quiet
          git diff --check
      # Full image/gameplay checks require a locally supplied game installation.
      # CI never fetches game assets or publishes a runnable game image.
