services:
  game:
    image: vice-city-standalone:local
    build:
      context: .
      dockerfile: standalone/Dockerfile
      args:
        PREPARE_JOBS: ${PREPARE_JOBS:-2}
        BROTLI_LEVEL: ${BROTLI_LEVEL:-6}
        ZSTD_LEVEL: ${ZSTD_LEVEL:-10}
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
